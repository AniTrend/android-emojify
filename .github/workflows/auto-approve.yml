name: Auto Approve

on: 
  pull_request_target:
    types:
      - opened
      - synchronize
  workflow_dispatch:
    inputs: 
      pullRequestNumber:
        description: Pull request number to auto-approve
        required: false
  
jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    # Skip sample catalog PRs (they carry the sample-dependencies label) until sample
    # validation exists; keep auto-approval for all other renovate PRs and manual dispatch.
    if: github.event_name == 'workflow_dispatch' || (github.actor == 'renovate[bot]' && !contains(github.event.pull_request.labels.*.name, 'sample-dependencies'))
    steps:
      - uses: hmarr/auto-approve-action@v4.0.0
        with:
          review-message: "Auto approved automated PR"
          pull-request-number: ${{ github.event.inputs.pullRequestNumber }}