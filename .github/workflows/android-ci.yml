name: Android CI

on:
  push:
    branches:
      - develop
    paths-ignore:
      - ".github/actions/python/**"
      - ".github/workflows/python-ci.yml"
      - "app/src/main/**"
      - "scripts/emoji_generator/**"
  pull_request:
    branches:
      - develop
    paths-ignore:
      - ".github/actions/python/**"
      - ".github/workflows/python-ci.yml"
      - "app/src/main/**"
      - "scripts/emoji_generator/**"

env:
  CI: true

jobs:
  wrapper-validation:
    name: Wrapper Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v4

  spotless:
    name: Spotless Check
    needs: wrapper-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Common setup
        uses: ./.github/actions/android
      - name: Run spotless check
        run: ./gradlew spotlessCheck

  gradle-dokka:
    name: Generate and deploy docs
    needs: wrapper-validation
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Common setup
        uses: ./.github/actions/android
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Generate docs with dokka
        run: ./gradlew dokkaHtmlMultiModule
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.7.3
        with:
          branch: docs # The branch the action should deploy to.
          folder: dokka-docs # The folder the action should deploy.
          token: ${{ steps.app-token.outputs.token }}

  unit-test:
    name: Unit Tests
    needs: [wrapper-validation, spotless]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Common setup
        uses: ./.github/actions/android
      - name: Run tests
        run: |
          ./gradlew emojify:preTest
          ./gradlew emojify:test --stacktrace
          ./gradlew emojify:postTest
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          token: ${{ steps.app-token.outputs.token }}

  publish-artifact:
    name: Publish Artifact
    needs: unit-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Common setup
        uses: ./.github/actions/android
      - name: Run build
        run: |
          ./gradlew emojify:preTest
          ./gradlew clean build --stacktrace
          ./gradlew emojify:postTest
      - name: Publish to Local Maven
        run: |
          ./gradlew publishMavenPublicationToMavenLocal
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publications
          path: ~/.m2/repository/io/wax911/emoji/