name: Repository CI

on:
  push:
    branches:
      - develop
    paths-ignore:
      - ".github/actions/python/**"
      - ".github/workflows/python-ci.yml"
      - ".github/workflows/python-cd.yml"
      - "app/src/main/**"
      - "scripts/emoji_generator/**"
  pull_request:
    branches:
      - develop

env:
  CI: true
  PYTHONUNBUFFERED: 1
  WORKSPACE: ./scripts/emoji_generator

jobs:
  changes:
    name: Detect Changes
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - '**'
              - '!.github/actions/python/**'
              - '!.github/workflows/python-ci.yml'
              - '!.github/workflows/python-cd.yml'
              - '!app/src/main/**'
              - '!scripts/emoji_generator/**'
            python:
              - '.github/actions/python/**'
              - '.github/workflows/android-ci.yml'
              - '.github/workflows/python-ci.yml'
              - '.github/workflows/python-cd.yml'
              - 'scripts/emoji_generator/**'

  wrapper-validation:
    name: Wrapper Validation
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6

  spotless:
    name: Spotless Check
    needs: [changes, wrapper-validation]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Common setup
        uses: ./.github/actions/android
      - name: Run spotless check
        run: ./gradlew spotlessCheck

  gradle-dokka:
    name: Generate and deploy docs
    needs: [changes, wrapper-validation]
    if: github.event_name == 'push' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Common setup
        uses: ./.github/actions/android
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Generate docs with dokka
        run: ./gradlew dokkaHtmlMultiModule
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          branch: docs # The branch the action should deploy to.
          folder: dokka-docs # The folder the action should deploy.
          token: ${{ steps.app-token.outputs.token }}

  unit-test:
    name: Unit Tests
    needs: [changes, wrapper-validation, spotless]
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Common setup
        uses: ./.github/actions/android
      - name: Run tests
        run: |
          ./gradlew emojify:preTest
          ./gradlew emojify:test --stacktrace
          ./gradlew emojify:postTest
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          token: ${{ steps.app-token.outputs.token }}

  publish-artifact:
    name: Publish Artifact
    needs: [changes, unit-test]
    if: github.event_name == 'push' && needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Common setup
        uses: ./.github/actions/android
      - name: Run build
        run: |
          ./gradlew emojify:preTest
          ./gradlew clean build --stacktrace
          ./gradlew emojify:postTest
      - name: Publish to Local Maven
        run: |
          ./gradlew publishMavenPublicationToMavenLocal
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: publications
          path: ~/.m2/repository/io/wax911/emoji/

  dependency-review:
    name: Dependency Review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.python == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - uses: actions/checkout@v6
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure
          fail-on-severity: moderate

  analyze:
    name: CodeQL Analysis
    needs: [changes, dependency-review]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.python == 'true' && always() && needs.dependency-review.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  lint-check:
    name: Lint Check
    needs: [changes, dependency-review]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.python == 'true' && always() && needs.dependency-review.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Common setup
        uses: ./.github/actions/python
        with:
          workspace: ${{ env.WORKSPACE }}
      - name: Run linter (Ruff)
        run: poetry run ruff check .

  format-check:
    name: Format Check
    needs: [changes, dependency-review]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.python == 'true' && always() && needs.dependency-review.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Common setup
        uses: ./.github/actions/python
        with:
          workspace: ${{ env.WORKSPACE }}
      - name: Check code formatting (Ruff)
        run: poetry run ruff format --check .

  type-check:
    name: Type Check
    needs: [changes, dependency-review]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.python == 'true' && always() && needs.dependency-review.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Common setup
        uses: ./.github/actions/python
        with:
          workspace: ${{ env.WORKSPACE }}
      - name: Run type checker (mypy)
        run: poetry run mypy .

  test:
    name: Python Tests
    needs: [analyze, lint-check, format-check, type-check]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Common setup
        uses: ./.github/actions/python
        with:
          workspace: ${{ env.WORKSPACE }}
      - name: Run tests
        run: poetry run pytest -v
